basics:
  mass_bin: 1e10
  tree_file: "./data/inputs/merger_trees.h5"
  dir_out: "./data/outputs/"

star_formation:
  efficiency: 0.015

supernova:
  # type: "no" # "instantaneous", "no", "delayed" 
  type: "delayed" # "instantaneous", "no", "delayed" 
  # type: "instantaneous" # "instantaneous", "no", "delayed" 
  delay_time: 0.015 #Gyr
  epsilon_p: 5
  pi_fid: 1

reionization:
  UVB_enabled: True
  z_reion: 7
  gamma: 15
  omega: 2

metallicity:
  Z_IGM: 1.0e-3 #Z_solar units
  Z_yield: 0.06

dust:
  m_swept: 1.0e+3 #Swept-up mass in SNe; epsilon_d x M_ISM
  dust_yield: 0.004
  dust_gamma: 1.3e-4
  dust_alpha: 8
  m_crit: 1.0e+5

black_holes:
  efficiency: 0.001 # BH growth efficiency (gas_mass / t_ff units, same form as SF efficiency)
  eta_agn: 0.5 # AGN wind mass-loading efficiency: Mdot_wind = eta_agn * Mdot_BH

  seeding:
    # Three independently enable-able seeding channels, checked in priority
    # order pop3 -> direct_collapse -> halo_mass_threshold; the first one
    # satisfied for a given halo wins. Z_gas_max thresholds are in the same
    # Z_solar units as metallicity.Z_IGM/Z_yield above.
    pop3:
      enabled: True
      z_min: 15 # only forms this early in the universe
      M_halo_min: 1.0e+6 # minihalo mass threshold (H2-cooling, Tvir ~ 1e4 K)
      Z_gas_max: 1.0e-4 # near-primordial gas required
      M_seed: 1.0e+2 # light seed: Pop III remnant mass

    direct_collapse:
      enabled: True
      z_min: 10
      M_halo_min: 1.0e+7 # atomic-cooling halo threshold
      Z_gas_max: 1.0e-5 # pristine gas required to suppress H2 fragmentation
      M_seed: 1.0e+5 # heavy seed

    halo_mass_threshold:
      enabled: True
      M_halo_min: 1.0e+10 # generic fallback: seed once the halo is massive enough
      M_seed: 1.0e+3
